<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Law Review Comment Viewer - v54</title>

<script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: #f8f9fa;
}
[contenteditable] { outline: none; }
[contenteditable]:focus { background-color: #f0f0f0; }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #f1f1f1; }
::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #4b5563; }

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.fade-in { animation: fadeIn 0.2s ease-in; }
.save-indicator { transition: opacity 0.3s ease; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const AUTO_SAVE_DELAY = 2000;
const LOCATION_PREVIEW_LENGTH = 50;
const MAX_HISTORY_SIZE = 50;
const DEBOUNCE_DELAY = 300;

function useDebounce(value, delay) {
  const [debouncedValue, setDebouncedValue] = useState(value);
  useEffect(() => {
    const handler = setTimeout(() => setDebouncedValue(value), delay);
    return () => clearTimeout(handler);
  }, [value, delay]);
  return debouncedValue;
}

function createEmptyItem() {
  return {
    id: "",
    admin: "",
    proof: "",
    galley: "",
    isHeading: false,
    _adminEditor: "",
    _proofEditor: "",
    _galleyEditor: "",
    _adminImplemented: false,
    _proofImplemented: false,
    _galleyImplemented: false
  };
}

// Icons
const ChevronDown = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <polyline points="6 9 12 15 18 9"></polyline>
  </svg>
);
const ChevronUp = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <polyline points="18 15 12 9 6 15"></polyline>
  </svg>
);
const ClipboardIcon = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1-2-2h2"></path>
    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
  </svg>
);

function SaveIndicator({ status }) {
  if (status === "saving") {
    return (
      <span className="save-indicator text-xs text-[#C99700] opacity-100 flex items-center">
        <svg className="animate-spin mr-1" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3">
          <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path>
        </svg>
      </span>
    );
  }
  if (status === "saved") return <span className="save-indicator text-xs text-[#4ADE80] opacity-100">✓</span>;
  if (status === "error") return <span className="save-indicator text-xs text-red-300 opacity-100">⚠</span>;
  return null;
}

function RichTextCell({ value, onChange, placeholder, column, commentId, itemIndex, addRowAfter }) {
  const editorRef = useRef(null);
  const isUpdatingRef = useRef(false);

  useEffect(() => {
    if (editorRef.current && !isUpdatingRef.current && document.activeElement !== editorRef.current) {
      if (editorRef.current.innerHTML !== (value || "")) {
        editorRef.current.innerHTML = value || "";
      }
    }
  }, [value]);

  const handleInput = useCallback((e) => {
    isUpdatingRef.current = true;
    let rawHtml = e.target.innerHTML;
    
    // Replace non-breaking spaces with our custom degree placeholder
    if (/\u00A0|&nbsp;/i.test(rawHtml)) {
      const sel = window.getSelection();
      let offset = 0;
      if (sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        const preRange = range.cloneRange();
        preRange.selectNodeContents(e.target);
        preRange.setEnd(range.startContainer, range.startOffset);
        offset = preRange.toString().length;
      }
      
      rawHtml = rawHtml.replace(/\u00A0/g, '°').replace(/&nbsp;/gi, '°');
      e.target.innerHTML = rawHtml;
      
      if (sel.rangeCount > 0) {
        const newRange = document.createRange();
        let curr = 0;
        const walk = (node) => {
          if (node.nodeType === 3) {
            if (curr + node.length >= offset) {
              newRange.setStart(node, offset - curr);
              return true;
            }
            curr += node.length;
          } else {
            for (let child of node.childNodes) if (walk(child)) return true;
          }
          return false;
        };
        walk(e.target);
        newRange.collapse(true);
        sel.removeAllRanges();
        sel.addRange(newRange);
      }
    }
    onChange(rawHtml);
    isUpdatingRef.current = false;
  }, [onChange]);

  const handlePaste = useCallback((e) => {
    e.preventDefault();
    const html = e.clipboardData.getData("text/html");
    if (html) {
      const temp = document.createElement("div");
      temp.innerHTML = html;
      
      const cleanNode = (node) => {
        if (node.nodeType === 3) return document.createTextNode(node.textContent.replace(/\u00A0/g, '°'));
        if (node.nodeType === 1) {
          const tag = node.tagName.toLowerCase();
          const s = node.style;
          const isB = tag === "b" || tag === "strong" || s.fontWeight === "bold" || s.fontWeight === "700";
          const isI = tag === "i" || tag === "em" || s.fontStyle === "italic";
          const isRed = s.color === "red" || s.color === "rgb(255, 0, 0)";
          
          let el = document.createDocumentFragment();
          Array.from(node.childNodes).forEach(c => el.appendChild(cleanNode(c)));
          
          if (isI) { const i = document.createElement("em"); i.appendChild(el); el = i; }
          if (isB) { const b = document.createElement("strong"); b.appendChild(el); el = b; }
          if (isRed) { const span = document.createElement("span"); span.style.color = "red"; span.appendChild(el); el = span; }
          return el;
        }
        return document.createTextNode("");
      };

      const fragment = document.createDocumentFragment();
      Array.from(temp.childNodes).forEach(n => fragment.appendChild(cleanNode(n)));
      const sel = window.getSelection();
      if (sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(fragment);
        range.collapse(false);
      }
      editorRef.current.dispatchEvent(new Event('input', { bubbles: true }));
    } else {
      const text = e.clipboardData.getData("text/plain").replace(/\u00A0/g, '°');
      document.execCommand("insertText", false, text);
    }
  }, []);

  const handleKeyDown = useCallback((e) => {
    if (e.key === ' ' && (e.altKey || (e.ctrlKey && e.shiftKey))) {
      e.preventDefault();
      document.execCommand("insertText", false, "°");
    } else if (e.shiftKey && e.key === "Enter") {
      e.preventDefault();
      if (addRowAfter) addRowAfter(commentId, itemIndex);
    }
  }, [addRowAfter, commentId, itemIndex]);

  return (
    <div className="relative w-full pr-5">
      <div
        ref={editorRef}
        contentEditable
        onInput={handleInput}
        onPaste={handlePaste}
        onKeyDown={handleKeyDown}
        data-cell-column={column}
        className="w-full min-h-[1.4rem] bg-transparent focus:bg-gray-100 focus:ring-1 focus:ring-gray-400 rounded px-1 py-0.5 cursor-text leading-tight outline-none"
        style={{ wordWrap: "break-word", whiteSpace: "pre-wrap", fontFamily: "Georgia, serif", fontSize: "12pt" }}
        suppressContentEditableWarning
      />
      {!value && <div className="absolute top-0.5 left-1 text-gray-400 pointer-events-none italic" style={{ fontFamily: "Georgia, serif", fontSize: "12pt" }}>{placeholder}</div>}
    </div>
  );
}

const MemoizedRichTextCell = React.memo(RichTextCell);

function CommentViewer() {
  const [expandedComments, setExpandedComments] = useState(new Set());
  const [collapsedColumns, setCollapsedColumns] = useState(new Set());
  const [comments, setComments] = useState([]);
  const [officeReady, setOfficeReady] = useState(false);
  const [loading, setLoading] = useState(true);
  const [showCreateDialog, setShowCreateDialog] = useState(false);
  const [newCommentId, setNewCommentId] = useState("");
  const [saveStatus, setSaveStatus] = useState("idle");
  const [smartPasteContent, setSmartPasteContent] = useState("");
  const [history, setHistory] = useState([]);
  const [historyIndex, setHistoryIndex] = useState(-1);
  const [currentUsername, setCurrentUsername] = useState(() => localStorage.getItem("lawReviewUsername") || null);
  const [showUsernameDialog, setShowUsernameDialog] = useState(false);
  const [tempUsername, setTempUsername] = useState("");
  const [searchQuery, setSearchQuery] = useState("");
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  const saveTimeoutRef = useRef(null);
  const pendingEditRef = useRef(null);
  const debouncedSearch = useDebounce(searchQuery, DEBOUNCE_DELAY);

  // Global copy handler for "Smart Paste"
  useEffect(() => {
    const handleGlobalCopy = (e) => {
      const sel = window.getSelection();
      if (!sel.rangeCount || sel.isCollapsed) return;
      const range = sel.getRangeAt(0);
      const div = document.createElement("div");
      div.appendChild(range.cloneContents());

      const process = (node) => {
        if (node.nodeType === 3) return node.textContent.replace(/°/g, '\u00A0').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
        if (node.nodeType === 1) {
          const s = node.style;
          const isB = s.fontWeight === "bold" || s.fontWeight === "700" || node.tagName === "STRONG" || node.tagName === "B";
          const isI = s.fontStyle === "italic" || node.tagName === "EM" || node.tagName === "I";
          const isR = s.color === "red" || s.color === "rgb(255, 0, 0)";
          let html = Array.from(node.childNodes).map(process).join("");
          let styles = [];
          if (isB) styles.push("font-weight:bold");
          if (isI) styles.push("font-style:italic");
          if (isR) styles.push("color:red");
          return styles.length ? `<span style="${styles.join(';')}">${html}</span>` : html;
        }
        return "";
      };

      const coreHTML = process(div);
      setSmartPasteContent(coreHTML);
      
      const fullHTML = `<html><head><meta charset="utf-8"></head><body><span style="font-family:Georgia;font-size:12pt;">${coreHTML}</span></body></html>`;
      e.clipboardData.setData("text/plain", div.textContent.replace(/°/g, '\u00A0'));
      e.clipboardData.setData("text/html", fullHTML);
      e.preventDefault();
    };
    document.addEventListener("copy", handleGlobalCopy);
    return () => document.removeEventListener("copy", handleGlobalCopy);
  }, []);

  // Red Toggle Logic Fix
  const toggleRed = useCallback(() => {
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed) return;
    const range = sel.getRangeAt(0);
    
    // Create a temporary container to inspect the selection's formatting
    const container = document.createElement("div");
    container.appendChild(range.cloneContents());
    
    // Robust check for any red color within the selection
    const html = container.innerHTML.toLowerCase();
    const hasRed = html.includes('color: red') || 
                   html.includes('color: rgb(255, 0, 0)') || 
                   html.includes('color="#ff0000"') ||
                   html.includes('color="red"');

    // If any red exists, clear it to black; otherwise make it red
    document.execCommand("foreColor", false, hasRed ? "black" : "red");
  }, []);

  const applyFormat = useCallback(cmd => document.execCommand(cmd, false, null), []);

  const toggleHighlight = useCallback(() => {
    const sel = window.getSelection();
    if (sel.rangeCount > 0) {
      const parent = sel.anchorNode.parentElement;
      const isHighlighted = parent && (parent.style.backgroundColor === "yellow" || parent.getAttribute('bg') === 'yellow');
      document.execCommand("hiliteColor", false, isHighlighted ? "transparent" : "yellow");
    }
  }, []);

  const saveToHistory = useCallback((next) => {
    setHistory(prev => {
      const branch = prev.slice(0, historyIndex + 1);
      branch.push(JSON.parse(JSON.stringify(next)));
      return branch.slice(-MAX_HISTORY_SIZE);
    });
    setHistoryIndex(prev => Math.min(prev + 1, MAX_HISTORY_SIZE - 1));
  }, [historyIndex]);

  const undo = () => { if (historyIndex > 0) { setComments(JSON.parse(JSON.stringify(history[historyIndex - 1]))); setHistoryIndex(historyIndex - 1); } };
  const redo = () => { if (historyIndex < history.length - 1) { setComments(JSON.parse(JSON.stringify(history[historyIndex + 1]))); setHistoryIndex(historyIndex + 1); } };

  // Word Integration
  const insertTextToWord = async (html) => {
    if (!officeReady || !html) return;
    try {
      await Word.run(async (ctx) => {
        const clean = html.replace(/°/g, '&nbsp;');
        ctx.document.getSelection().insertHtml(`<span style="font-family:Georgia;font-size:12pt;">${clean}</span>`, "Replace");
        await ctx.sync();
      });
    } catch (e) { console.error(e); }
  };

  const loadCommentsFromWord = async () => {
    setLoading(true);
    try {
      await Word.run(async (ctx) => {
        const wc = ctx.document.body.getComments();
        wc.load("items");
        await ctx.sync();
        const data = [];
        for (let item of wc.items) {
          item.load("content");
          const r = item.getRange();
          r.load("start");
          await ctx.sync();
          let id = item.content, items = [createEmptyItem()];
          if (id.includes("|||")) {
            const parts = id.split("|||");
            id = parts[0];
            try { items = JSON.parse(parts[1]).items; } catch (e) {}
          }
          data.push({ id, position: r.start, location: `Position ${r.start}`, items });
        }
        data.sort((a, b) => a.position - b.position);
        setComments(data);
        if (data.length) { setHistory([JSON.parse(JSON.stringify(data))]); setHistoryIndex(0); setExpandedComments(new Set([data[0].id])); }
      });
    } finally { setLoading(false); }
  };

  const saveCommentsToWordSilent = async () => {
    if (!officeReady) return;
    setSaveStatus("saving");
    try {
      await Word.run(async (ctx) => {
        const wc = ctx.document.body.getComments();
        wc.load("items");
        await ctx.sync();
        for (let item of wc.items) {
          item.load("content");
          await ctx.sync();
          const cid = item.content.split("|||")[0];
          const ours = comments.find(c => c.id === cid);
          if (ours) item.content = `${ours.id}|||${JSON.stringify({ items: ours.items })}`;
        }
        await ctx.sync();
        setSaveStatus("saved");
        setTimeout(() => setSaveStatus("idle"), 2000);
      });
    } catch (e) { setSaveStatus("error"); }
  };

  useEffect(() => {
    Office.onReady(info => { if (info.host === Office.HostType.Word) { setOfficeReady(true); loadCommentsFromWord(); } });
  }, []);

  useEffect(() => {
    if (!officeReady || !comments.length) return;
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(saveCommentsToWordSilent, AUTO_SAVE_DELAY);
    return () => clearTimeout(saveTimeoutRef.current);
  }, [comments, officeReady]);

  const updateCell = useCallback((cid, idx, col, val) => {
    if (!currentUsername && !col.startsWith("_") && col !== "id" && val?.trim()) {
      pendingEditRef.current = { cid, idx, col, val };
      setShowUsernameDialog(true);
      return;
    }
    setComments(prev => prev.map(c => {
      if (c.id !== cid) return c;
      const nextItems = [...c.items];
      const nextItem = { ...nextItems[idx], [col]: val };
      if (currentUsername && !col.startsWith("_") && col !== "id") nextItem[`_${col}Editor`] = currentUsername;
      nextItems[idx] = nextItem;
      return { ...c, items: nextItems };
    }));
  }, [currentUsername]);

  const finalizeCreate = async () => {
    if (!newCommentId.trim() || comments.some(c => c.id === newCommentId)) return;
    try {
      await Word.run(async (ctx) => {
        ctx.document.getSelection().insertComment(newCommentId);
        await ctx.sync();
        const nc = { id: newCommentId, location: "Selected Text", items: [createEmptyItem()] };
        const next = [...comments, nc];
        setComments(next);
        saveToHistory(next);
        setExpandedComments(s => new Set([...s, newCommentId]));
        setShowCreateDialog(false);
        setNewCommentId("");
      });
    } catch (e) { alert(e.message); }
  };

  const filtered = useMemo(() => {
    const q = debouncedSearch.toLowerCase();
    if (!q) return comments;
    return comments.filter(c => c.id.toLowerCase().includes(q) || c.items.some(i => i.admin.toLowerCase().includes(q) || i.proof.toLowerCase().includes(q) || i.galley.toLowerCase().includes(q)));
  }, [comments, debouncedSearch]);

  return (
    <div className="h-screen flex flex-col bg-gray-50 overflow-hidden">
      {/* Header */}
      <div className="bg-[#0C2340] px-3 py-2">
        <div className="flex items-center justify-between mb-2">
          <div className="flex items-center gap-2">
            <h1 className="text-white font-bold text-sm">Law Review Comment Viewer</h1>
            <SaveIndicator status={saveStatus} />
          </div>
          <div className="flex gap-1">
            <button onClick={() => setShowCreateDialog(true)} className="bg-[#C99700] hover:bg-[#B8860B] text-white px-2 py-0.5 rounded text-xs transition-colors">+ New</button>
            <button onClick={loadCommentsFromWord} className="bg-[#1E3A5F] text-white px-2 py-0.5 rounded text-xs hover:bg-[#2D4A6F]">Refresh</button>
            <button onClick={() => insertTextToWord(smartPasteContent)} disabled={!smartPasteContent} className="bg-[#1E3A5F] text-white px-2 py-0.5 rounded text-xs disabled:opacity-50"><ClipboardIcon /></button>
          </div>
        </div>
        
        <div className="flex gap-1 mb-2">
          <button onClick={() => applyFormat("bold")} className="px-2 py-0.5 bg-gray-700 text-white text-xs rounded font-bold">B</button>
          <button onClick={() => applyFormat("italic")} className="px-2 py-0.5 bg-gray-700 text-white text-xs rounded italic">I</button>
          <button onClick={toggleHighlight} className="px-2 py-0.5 bg-[#C99700] text-white text-xs rounded">Highlight</button>
          <button onClick={toggleRed} className="px-2 py-0.5 bg-red-600 text-white text-xs rounded">Red</button>
          <button onClick={() => applyFormat("removeFormat")} className="px-2 py-0.5 bg-gray-700 text-red-400 text-xs rounded">✕</button>
          <div className="flex-1"></div>
          <button onClick={undo} className="px-2 py-0.5 bg-gray-700 text-white text-xs rounded">⎌</button>
          <button onClick={redo} className="px-2 py-0.5 bg-gray-700 text-white text-xs rounded">↷</button>
        </div>

        <input 
          type="text" 
          value={searchQuery} 
          onChange={e => setSearchQuery(e.target.value)} 
          placeholder="Search..." 
          className="w-full px-2 py-1 text-xs bg-gray-800 text-white border border-gray-600 rounded outline-none" 
        />
      </div>

      {/* Main Content */}
      <div className="flex-1 overflow-y-auto p-2">
        {loading ? <div className="p-10 text-center text-gray-400 text-xs">Loading...</div> : 
         filtered.map(c => (
          <div key={c.id} className="mb-2 bg-white border border-gray-200 rounded shadow-sm overflow-hidden">
            <div 
              className="bg-gray-100 px-2 py-1 flex items-center gap-2 cursor-pointer hover:bg-gray-200"
              onClick={() => setExpandedComments(prev => { const next = new Set(prev); if (next.has(c.id)) next.delete(c.id); else next.add(c.id); return next; })}
            >
              {expandedComments.has(c.id) ? <ChevronUp /> : <ChevronDown />}
              <span className="font-bold text-xs">{c.id}</span>
              <span className="text-[10px] text-gray-500 truncate">{c.location}</span>
            </div>

            {expandedComments.has(c.id) && (
              <div className="overflow-x-auto">
                <table className="w-full text-xs border-collapse">
                  <thead>
                    <tr className="bg-gray-50 border-b border-gray-200">
                      <th className="w-8 border-r">#</th>
                      {['admin', 'proof', 'galley'].map(col => (
                        <th key={col} className="min-w-[200px] border-r text-left px-2 py-1 uppercase text-[10px] text-gray-500">{col}</th>
                      ))}
                      <th className="w-8"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {c.items.map((item, idx) => (
                      <tr key={idx} className={`${item.isHeading ? 'bg-yellow-50' : 'bg-white'} border-b last:border-0`}>
                        <td className="border-r align-top">
                          <input 
                            value={item.id} 
                            onChange={e => updateCell(c.id, idx, 'id', e.target.value)} 
                            className="w-full px-1 py-1 bg-transparent text-center font-bold"
                          />
                        </td>
                        {['admin', 'proof', 'galley'].map(col => (
                          <td key={col} className={`border-r align-top relative p-1 ${item[`_${col}Implemented`] ? 'bg-green-50' : ''}`}>
                             <button 
                               onClick={() => setComments(prev => prev.map(com => com.id === c.id ? {...com, items: com.items.map((it, i) => i === idx ? {...it, [`_${col}Implemented`]: !it[`_${col}Implemented`]} : it)} : com))}
                               className={`absolute top-0 right-0 p-0.5 rounded text-[8px] ${item[`_${col}Implemented`] ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-400'}`}
                             >✓</button>
                             <MemoizedRichTextCell 
                               value={item[col]} 
                               onChange={val => updateCell(c.id, idx, col, val)} 
                               column={col} commentId={c.id} itemIndex={idx}
                               addRowAfter={(cid, i) => setComments(prev => prev.map(com => com.id === cid ? {...com, items: [...com.items.slice(0, i+1), createEmptyItem(), ...com.items.slice(i+1)]} : com))}
                             />
                             {item[`_${col}Editor`] && <div className="text-[9px] text-gray-400 italic px-1">{item[`_${col}Editor`]}</div>}
                          </td>
                        ))}
                        <td className="align-top p-1 flex flex-col gap-1">
                          <button onClick={() => setComments(prev => prev.map(com => com.id === c.id ? {...com, items: com.items.map((it, i) => i === idx ? {...it, isHeading: !it.isHeading} : it)} : com))} className="text-[10px] bg-gray-100 hover:bg-gray-200 rounded">H</button>
                          <button onClick={() => setComments(prev => prev.map(com => com.id === c.id ? {...com, items: com.items.filter((_, i) => i !== idx || com.items.length === 1)} : com))} className="text-[10px] text-red-500 hover:bg-red-50 rounded">×</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        ))}
      </div>

      {/* Username Dialog */}
      {showUsernameDialog && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white p-6 rounded-lg shadow-xl w-full max-w-xs">
            <h3 className="font-bold mb-4">Identify Yourself</h3>
            <input 
              autoFocus
              className="w-full border p-2 mb-4 rounded" 
              placeholder="Full Name"
              value={tempUsername} 
              onChange={e => setTempUsername(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') { localStorage.setItem("lawReviewUsername", tempUsername); setCurrentUsername(tempUsername); setShowUsernameDialog(false); if (pendingEditRef.current) { const {cid, idx, col, val} = pendingEditRef.current; updateCell(cid, idx, col, val); pendingEditRef.current = null; } } }}
            />
            <button onClick={() => setShowUsernameDialog(false)} className="text-gray-400 text-xs w-full">Cancel</button>
          </div>
        </div>
      )}

      {/* Create Dialog */}
      {showCreateDialog && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white p-6 rounded-lg shadow-xl w-full max-w-xs">
            <h3 className="font-bold mb-4">New Comment ID</h3>
            <input 
              autoFocus
              className="w-full border p-2 mb-4 rounded" 
              placeholder="e.g. 101A"
              value={newCommentId} 
              onChange={e => setNewCommentId(e.target.value)}
            />
            <div className="flex gap-2">
              <button onClick={() => setShowCreateDialog(false)} className="flex-1 p-2 text-xs">Cancel</button>
              <button onClick={finalizeCreate} className="flex-1 p-2 bg-[#C99700] text-white rounded font-bold">Create</button>
            </div>
          </div>
        </div>
      )}

      <div className="bg-gray-100 text-[10px] px-2 py-1 text-gray-400 flex justify-between">
        <span>v54</span>
        <span>{comments.length} Comments Loaded</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CommentViewer />);
</script>
</body>
</html>
