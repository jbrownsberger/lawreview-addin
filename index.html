// --- Error Boundary Component ---
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }

  componentDidCatch(error, errorInfo) {
    console.error("React Error:", error, errorInfo);
  }

  render() {
    if (this.state.hasError) {
      return (
        <div className="p-4 bg-red-50 text-red-800 border border-red-200 m-4 rounded">
          <h2 className="font-bold mb-2">Something went wrong.</h2>
          <p className="text-xs font-mono">{this.state.error?.toString()}</p>
          <button onClick={() => window.location.reload()} className="mt-4 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Reload Add-in</button>
        </div>
      );
    }
    return this.props.children;
  }
}

function useDebounce(value, delay) {
  const [debouncedValue, setDebouncedValue] = useState(value);
  useEffect(() => {
    const handler = setTimeout(() => setDebouncedValue(value), delay);
    return () => clearTimeout(handler);
  }, [value, delay]);
  return debouncedValue;
}

// --- Helper to auto-linkify text ---
function transformTextToLinks(html) {
  if (!html) return html;
  
  try {
    const temp = document.createElement('div');
    temp.innerHTML = html;
    
    // Check if TreeWalker is supported
    if (!document.createTreeWalker) return html;

    const walker = document.createTreeWalker(temp, NodeFilter.SHOW_TEXT, null, false);
    const nodesToProcess = [];
    let node;
    
    while(node = walker.nextNode()) {
      if (node.parentElement && node.parentElement.tagName === 'A') continue;
      nodesToProcess.push(node);
    }
    
    let modified = false;
    
    nodesToProcess.forEach(textNode => {
      let text = textNode.textContent;
      let newHtml = text;
      let nodeModified = false;
      
      // 1. Bluebook Regex: BB 1.2
      newHtml = newHtml.replace(/\bBB\s+(\d+(?:\.\d+)?)\b/g, (match, rule) => {
        nodeModified = true;
        modified = true;
        return `<a href="https://www.legalbluebook.com/bluebook/search-results?search=${rule}&facet=whitepages" target="_blank" style="color: blue; text-decoration: underline;">${match}</a>`;
      });
      
      // 2. CMOS Regex: CMOS 5.1
      newHtml = newHtml.replace(/\bCMOS\s+(\d+)\.(\d+)\b/g, (match, ch, sec) => {
        nodeModified = true;
        modified = true;
        const chNum = parseInt(ch, 10);
        const chPad = String(chNum).padStart(2, '0');
        const secPad = String(sec).padStart(3, '0');
        let part = 'part1';
        if (chNum >= 5 && chNum <= 10) part = 'part2';
        else if (chNum >= 11 && chNum <= 16) part = 'part3';
        const url = `https://www-chicagomanualofstyle-org.proxy.library.nd.edu/book/ed18/${part}/ch${chPad}/psec${secPad}.html`;
        return `<a href="${url}" target="_blank" style="color: blue; text-decoration: underline;">${match}</a>`;
      });

      // 3. Goldbook Regex: GB 104
      newHtml = newHtml.replace(/\bGB\s+(\d+(?:\.\d+)?)\b/g, (match, rule) => {
        nodeModified = true;
        modified = true;
        return `<a href="https://jbrownsberger.github.io/GoldbookWeb/#rule-${rule}" target="_blank" style="color: blue; text-decoration: underline;">${match}</a>`;
      });
      
      if (nodeModified) {
        const span = document.createElement('span');
        span.innerHTML = newHtml;
        textNode.parentNode.replaceChild(span, textNode);
      }
    });
    
    return modified ? temp.innerHTML : html;
  } catch (e) {
    console.error("Link transform error", e);
    return html;
  }
}

function RichTextCell({ value, onChange, placeholder, column, commentId, itemIndex, addRowAfter, isEditing }) {
  const editorRef = useRef(null);
  const isUpdatingRef = useRef(false);

  // Consolidated initialization and update logic
  useEffect(() => {
    if (!editorRef.current) return;
    
    // Initial set or external update (when not typing)
    if (!isUpdatingRef.current && document.activeElement !== editorRef.current) {
        if (editorRef.current.innerHTML !== (value || "")) {
            editorRef.current.innerHTML = value || "";
        }
    }
  }, [value]);

  const handleInput = useCallback((e) => {
    if (!isEditing) return;
    isUpdatingRef.current = true;
    let rawHtml = e.target.innerHTML;
    
    // Nbsp to custom placeholder
    if (/\u00A0|&nbsp;/i.test(rawHtml)) {
      const sel = window.getSelection();
      let cursorOffset = 0;
      if (sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        const preCaretRange = range.cloneRange();
        preCaretRange.selectNodeContents(e.target);
        preCaretRange.setEnd(range.startContainer, range.startOffset);
        cursorOffset = preCaretRange.toString().length;
      }
      
      rawHtml = rawHtml.replace(/\u00A0/g, '°').replace(/&nbsp;/gi, '°');
      e.target.innerHTML = rawHtml;
      
      if (sel.rangeCount > 0) {
        const newRange = document.createRange();
        let charCount = 0;
        let found = false;
        
        const walkNodes = (node) => {
          if (found) return;
          if (node.nodeType === Node.TEXT_NODE) {
            const nextCount = charCount + node.textContent.length;
            if (cursorOffset <= nextCount) {
              newRange.setStart(node, cursorOffset - charCount);
              newRange.collapse(true);
              found = true;
            }
            charCount = nextCount;
          } else {
            for (const child of node.childNodes) {
              walkNodes(child);
              if (found) return;
            }
          }
        };
        walkNodes(e.target);
        if (found) {
          sel.removeAllRanges();
          sel.addRange(newRange);
        }
      }
    }
    
    onChange(rawHtml);
    isUpdatingRef.current = false;
  }, [onChange, isEditing]);

  const handleBlur = useCallback(() => {
    if (editorRef.current && isEditing) {
        const currentHtml = editorRef.current.innerHTML;
        const linkedHtml = transformTextToLinks(currentHtml);
        if (linkedHtml !== currentHtml) {
            editorRef.current.innerHTML = linkedHtml;
            onChange(linkedHtml);
        }
    }
  }, [onChange, isEditing]);

  const handlePaste = useCallback((e) => {
    if (!isEditing) return;
    e.preventDefault();
    const html = e.clipboardData.getData("text/html");

    if (html) {
      const temp = document.createElement("div");
      temp.innerHTML = html;

      const processNode = (node) => {
        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.textContent.replace(/\u00A0/g, '°');
          return document.createTextNode(text);
        }
        if (node.nodeType === Node.ELEMENT_NODE) {
          const tagName = node.tagName.toLowerCase();
          const style = node.style;
          const styleAttr = node.getAttribute("style") || "";
          
          const isBold = tagName === "b" || tagName === "strong" || style.fontWeight === "bold" || style.fontWeight === "700" || styleAttr.includes("font-weight: bold");
          const isItalic = tagName === "i" || tagName === "em" || style.fontStyle === "italic" || styleAttr.includes("font-style: italic");

          const children = Array.from(node.childNodes).map(processNode);
          let resultElement = null;
          
          if (isItalic) {
            const em = document.createElement("em");
            children.forEach((child) => em.appendChild(child));
            resultElement = em;
          }
          if (isBold) {
            const strong = document.createElement("strong");
            if (resultElement) strong.appendChild(resultElement);
            else children.forEach((child) => strong.appendChild(child));
            resultElement = strong;
          }
          
          if (resultElement) return resultElement;
          else {
            const fragment = document.createDocumentFragment();
            children.forEach((child) => fragment.appendChild(child));
            return fragment;
          }
        }
        return document.createTextNode("");
      };

      const processed = document.createDocumentFragment();
      Array.from(temp.childNodes).forEach((node) => processed.appendChild(processNode(node)));

      const selection = window.getSelection();
      if (selection.rangeCount > 0) {
        const range = selection.getRangeAt(0);
        range.deleteContents();
        range.insertNode(processed);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
      }
      if (editorRef.current) {
        editorRef.current.dispatchEvent(new Event('input', { bubbles: true }));
      }
    } else {
      const text = e.clipboardData.getData("text/plain");
      const convertedText = text.replace(/\u00A0/g, '°');
      document.execCommand("insertText", false, convertedText);
    }
  }, [isEditing]);

  const handleKeyDown = useCallback((e) => {
    if (!isEditing) return;
    if (e.key === ' ' && (e.altKey || (e.ctrlKey && e.shiftKey))) {
      e.preventDefault();
      document.execCommand("insertText", false, "°");
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key === "b") {
      e.preventDefault();
      document.execCommand("bold", false, null);
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key === "i") {
      e.preventDefault();
      document.execCommand("italic", false, null);
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key === "u") {
      e.preventDefault();
      document.execCommand("underline", false, null);
      return;
    }
    if (e.shiftKey && e.key === "Enter") {
      e.preventDefault();
      if (addRowAfter && commentId && itemIndex !== undefined) {
        addRowAfter(commentId, itemIndex);
        // Focus logic handled in parent render ref sync if needed, 
        // but simplified here to just trigger row add.
      }
      return;
    }
    if (e.key === "Tab") {
      e.preventDefault();
      const allCells = Array.from(document.querySelectorAll('[data-cell-column="' + column + '"]'));
      const currentIndex = allCells.indexOf(editorRef.current);
      const nextIndex = e.shiftKey ? currentIndex - 1 : currentIndex + 1;
      if (nextIndex >= 0 && nextIndex < allCells.length) {
        const nextCell = allCells[nextIndex];
        nextCell.focus();
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(nextCell);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }
  }, [column, addRowAfter, commentId, itemIndex, isEditing]);

  return (
    <div className="relative w-full" style={{ paddingRight: "20px" }}>
      <div
        ref={editorRef}
        contentEditable={isEditing}
        onInput={handleInput}
        onBlur={handleBlur}
        onPaste={handlePaste}
        onKeyDown={handleKeyDown}
        data-cell-column={column}
        className={`w-full min-h-[1.4rem] bg-transparent rounded px-1 py-0.5 leading-tight ${isEditing ? 'cursor-text focus:bg-gray-100 focus:ring-1 focus:ring-gray-400' : 'cursor-default'}`}
        style={{
          wordWrap: "break-word",
          whiteSpace: "pre-wrap",
          fontFamily: "Georgia, serif",
          fontSize: "12pt"
        }}
        suppressContentEditableWarning
      />
      {!value && (
        <div className="absolute top-0.5 left-1 text-gray-400 pointer-events-none select-none italic" style={{ fontFamily: "Georgia, serif", fontSize: "12pt" }}>
          {placeholder}
        </div>
      )}
    </div>
  );
}

const MemoizedRichTextCell = React.memo(RichTextCell);

// --- MEMOIZED ROW COMPONENT ---
const CommentRow = React.memo(({ item, idx, commentId, columns, collapsedColumns, updateCell, toggleCellImplemented, insertTextToWord, addRowAfter, toggleHeading, setDeleteConfirm, isEditing }) => {
  const rowBgClass = item.isHeading ? "bg-[#FEF9C3]" : (idx % 2 === 0 ? "bg-white" : "bg-gray-50");
  const handleIdChange = (e) => updateCell(commentId, idx, "id", e.target.value);
  
  if (!item) return null; // Safety check

  return (
    <tr className={`group ${rowBgClass} transition-colors`}>
      <td className="px-1 py-0 font-semibold text-gray-700 border-r border-gray-200 align-top" style={{ minWidth: "40px", width: "40px" }}>
        <input 
          type="text" 
          value={item.id || ""} 
          onChange={handleIdChange} 
          disabled={!isEditing}
          className={"w-full bg-transparent border-none focus:outline-none focus:ring-1 focus:ring-gray-500 rounded px-1 py-1 text-xs" + (item.isHeading ? " font-bold" : "")} 
          placeholder="#" 
        />
      </td>
      {columns.map((col) => (
        !collapsedColumns.has(col.key) ? (
          <td key={col.key} className={"px-1 py-0 text-gray-800 border-r border-gray-200 align-top relative" + (item["_" + col.key + "Implemented"] ? " bg-[#DCFCE7]" : "")}>
            <button 
              onClick={(e) => { e.stopPropagation(); toggleCellImplemented(commentId, idx, col.key); }} 
              disabled={!isEditing}
              className={"absolute top-0 right-0 w-5 h-5 flex items-center justify-center rounded text-xs transition-colors" + (item["_" + col.key + "Implemented"] ? " bg-[#00843D] text-white" : " bg-gray-200 text-gray-500 hover:bg-gray-300") + (!isEditing ? " opacity-50 cursor-not-allowed" : " cursor-pointer")} 
              title={item["_" + col.key + "Implemented"] ? "Mark as not implemented" : "Mark as implemented"}>✓</button>
            <div className={item.isHeading ? "font-semibold" : ""}>
              <MemoizedRichTextCell 
                value={item[col.key]} 
                onChange={(html) => updateCell(commentId, idx, col.key, html)} 
                placeholder="—" 
                column={col.key} 
                commentId={commentId}
                itemIndex={idx}
                addRowAfter={addRowAfter}
                isEditing={isEditing}
              />
            </div>
          </td>
        ) : null
      ))}
      {collapsedColumns.size > 0 && <td className="border-r border-gray-200"></td>}
      <td className="px-1 py-0 align-top">
        {isEditing && (
          <div className="flex flex-col gap-0 py-0.5">
            <button onClick={() => addRowAfter(commentId, idx)} className="w-5 h-4 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded text-gray-600 text-xs transition-colors" title="Add row below">+</button>
            <button onClick={() => toggleHeading(commentId, idx)} className={"w-5 h-4 flex items-center justify-center rounded text-xs transition-colors" + (item.isHeading ? " bg-[#C99700] text-white" : " bg-gray-100 hover:bg-gray-200 text-gray-600")} title="Toggle heading">H</button>
            <button onClick={() => setDeleteConfirm({ commentId: commentId, itemIndex: idx })} className="w-5 h-4 flex items-center justify-center bg-gray-100 hover:bg-red-100 hover:text-red-600 rounded text-gray-600 text-xs transition-colors" title="Delete row">×</button>
          </div>
        )}
      </td>
    </tr>
  );
});

function CommentViewer() {
  const [expandedComments, setExpandedComments] = useState(new Set());
  const [collapsedColumns, setCollapsedColumns] = useState(new Set());
  const [comments, setComments] = useState([]);
  const [officeReady, setOfficeReady] = useState(false);
  const [loading, setLoading] = useState(true);
  const [loadingProgress, setLoadingProgress] = useState(0);
  const [showCreateDialog, setShowCreateDialog] = useState(false);
  const [newCommentId, setNewCommentId] = useState("");
  const [newCommentLocation, setNewCommentLocation] = useState("");
  const [saveStatus, setSaveStatus] = useState("idle");
  const [smartPasteContent, setSmartPasteContent] = useState("");
  const commentIdInputRef = useRef(null);
  const [history, setHistory] = useState([]);
  const [historyIndex, setHistoryIndex] = useState(-1);
  const [currentUsername, setCurrentUsername] = useState(() => {
    try {
      return localStorage.getItem("lawReviewUsername") || null;
    } catch (e) {
      return null;
    }
  });
  const [showUsernameDialog, setShowUsernameDialog] = useState(false);
  const [tempUsername, setTempUsername] = useState("");
  const pendingEditRef = useRef(null);
  const [searchQuery, setSearchQuery] = useState("");
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const [editingCommentIds, setEditingCommentIds] = useState(new Set());
  const [savingCommentId, setSavingCommentId] = useState(null);

  const debouncedSearchQuery = useDebounce(searchQuery, DEBOUNCE_DELAY);

  useEffect(() => {
    if (currentUsername) {
      try {
        localStorage.setItem("lawReviewUsername", currentUsername);
      } catch (e) {
        console.error("Could not save username to localStorage");
      }
    }
  }, [currentUsername]);

  // Global copy handler
  useEffect(() => {
    const handleGlobalCopy = (e) => {
      const selection = window.getSelection();
      if (selection.rangeCount > 0 && !selection.isCollapsed) {
        const range = selection.getRangeAt(0);
        const container = document.createElement("div");
        container.appendChild(range.cloneContents());

        container.querySelectorAll('[style*="background"]').forEach((el) => {
          el.style.backgroundColor = "";
          el.style.background = "";
        });
        
        const processNodeForWord = (node) => {
          if (node.nodeType === Node.TEXT_NODE) {
            return node.textContent.replace(/°/g, '\u00A0')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');
          }
          if (node.nodeType === Node.ELEMENT_NODE) {
            const tagName = node.tagName.toLowerCase();
            const style = node.style;
            const styleAttr = node.getAttribute("style") || "";
            
            if (tagName === "a") {
                const href = node.getAttribute("href");
                const content = Array.from(node.childNodes).map(processNodeForWord).join("");
                return `<a href="${href}">${content}</a>`;
            }

            const isBold = tagName === "b" || tagName === "strong" || style.fontWeight === "bold" || style.fontWeight === "700" || styleAttr.includes("font-weight: bold");
            const isItalic = tagName === "i" || tagName === "em" || style.fontStyle === "italic" || styleAttr.includes("font-style: italic");
            const isRed = style.color === "red" || style.color === "rgb(255, 0, 0)" || styleAttr.includes("color: red");

            let childHTML = "";
            for (const child of node.childNodes) {
              childHTML += processNodeForWord(child);
            }
            
            const styleParts = [];
            if (isBold) styleParts.push("font-weight:bold");
            if (isItalic) styleParts.push("font-style:italic");
            if (isRed) styleParts.push("color:red");
            
            if (styleParts.length > 0) {
              return '<span style="' + styleParts.join(';') + '">' + childHTML + '</span>';
            } else {
              return childHTML;
            }
          }
          return "";
        };
        
        const contentHTML = processNodeForWord(container);
        setSmartPasteContent(contentHTML);
        
        const wordHTML = 
          '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">' +
          '<head><meta charset="utf-8"></head>' +
          '<body>' +
          '<span style="font-family:Georgia;font-size:12.0pt;">' + contentHTML + '</span>' +
          '</body>' +
          '</html>';
        
        let plainText = container.textContent.replace(/°/g, '\u00A0');
        e.clipboardData.setData("text/plain", plainText);
        e.clipboardData.setData("text/html", wordHTML);
        e.preventDefault();
      }
    };

    document.addEventListener("copy", handleGlobalCopy);
    return () => document.removeEventListener("copy", handleGlobalCopy);
  }, []);

  const applyFormat = useCallback((command) => {
    document.execCommand(command, false, null);
  }, []);

  const toggleHighlight = useCallback(() => {
    const selection = window.getSelection();
    if (selection.rangeCount > 0) {
      const range = selection.getRangeAt(0);
      const container = range.commonAncestorContainer;
      const parent = container.nodeType === Node.TEXT_NODE ? container.parentElement : container;

      if (parent && parent.style.backgroundColor === "yellow") {
        document.execCommand("hiliteColor", false, "transparent");
      } else {
        document.execCommand("hiliteColor", false, "yellow");
      }
    }
  }, []);

  const toggleRed = useCallback(() => {
    const selection = window.getSelection();
    if (selection.rangeCount > 0 && !selection.isCollapsed) {
      const range = selection.getRangeAt(0);
      
      let hasRed = false;
      const parent = range.commonAncestorContainer.nodeType === Node.TEXT_NODE 
        ? range.commonAncestorContainer.parentElement 
        : range.commonAncestorContainer;
      
      const computedColor = window.getComputedStyle(parent).color;
      if (computedColor === 'rgb(255, 0, 0)' || parent.style.color === 'red') {
        hasRed = true;
      } else {
        const fragment = range.cloneContents();
        const div = document.createElement('div');
        div.appendChild(fragment);
        if (div.querySelector('[style*="color: red"]') || 
            div.querySelector('[style*="color: rgb(255, 0, 0)"]') ||
            div.querySelector('font[color="red"]')) {
            hasRed = true;
        }
      }

      if (hasRed) {
        document.execCommand("foreColor", false, "black");
      } else {
        document.execCommand("foreColor", false, "red");
      }
    }
  }, []);

  const toggleCellImplemented = useCallback((commentId, itemIndex, column) => {
    setComments((prevComments) => prevComments.map((comment) => {
      if (comment.id === commentId) {
        const newItems = [...comment.items];
        const item = newItems[itemIndex];
        const implKey = "_" + column + "Implemented";
        newItems[itemIndex] = { ...item, [implKey]: !item[implKey] };
        return { ...comment, items: newItems };
      }
      return comment;
    }));
  }, []);

  const saveToHistory = useCallback((newComments) => {
    setHistory((prevHistory) => {
      const newHistory = prevHistory.slice(0, historyIndex + 1);
      newHistory.push(JSON.parse(JSON.stringify(newComments)));
      if (newHistory.length > MAX_HISTORY_SIZE) {
        newHistory.shift();
      }
      return newHistory;
    });
    setHistoryIndex((prev) => Math.min(prev + 1, MAX_HISTORY_SIZE - 1));
  }, [historyIndex]);

  const undo = useCallback(() => {
    if (historyIndex > 0) {
      const previousState = history[historyIndex - 1];
      setComments(JSON.parse(JSON.stringify(previousState)));
      setHistoryIndex(historyIndex - 1);
    }
  }, [history, historyIndex]);

  const redo = useCallback(() => {
    if (historyIndex < history.length - 1) {
      const nextState = history[historyIndex + 1];
      setComments(JSON.parse(JSON.stringify(nextState)));
      setHistoryIndex(historyIndex + 1);
    }
  }, [history, historyIndex]);

  const insertTextToWord = useCallback(async (htmlContent) => {
    if (!officeReady || !htmlContent) return;
    try {
      await Word.run(async (context) => {
        const selection = context.document.getSelection();
        let cleanHtml = htmlContent.replace(/°/g, '&nbsp;');
        const wrappedHtml = `<span style="font-family: 'Georgia', serif; font-size: 12pt;">${cleanHtml}</span>`;
        selection.insertHtml(wrappedHtml, Word.InsertLocation.replace);
        await context.sync();
      });
    } catch (error) {
      console.error("Error inserting text:", error);
    }
  }, [officeReady]);

  useEffect(() => {
    const handleGlobalKeyDown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "z") {
        if (e.shiftKey) {
          e.preventDefault();
          redo();
        } else {
          const activeEl = document.activeElement;
          if (!activeEl || activeEl.contentEditable !== "true") {
            e.preventDefault();
            undo();
          }
        }
      }
    };
    window.addEventListener("keydown", handleGlobalKeyDown);
    return () => window.removeEventListener("keydown", handleGlobalKeyDown);
  }, [undo, redo]);

  useEffect(() => {
    Office.onReady((info) => {
      if (info.host === Office.HostType.Word) {
        setOfficeReady(true);
        loadCommentsFromWord();
      }
    });
  }, []);

  const handleEditComment = useCallback((commentId) => {
    setEditingCommentIds(prev => new Set(prev).add(commentId));
  }, []);

  const handleSaveComment = useCallback(async (commentId) => {
    if (!officeReady) return;
    const commentData = comments.find(c => c.id === commentId);
    if (!commentData) return;

    setSavingCommentId(commentId);
    try {
      await Word.run(async (context) => {
        const wordComments = context.document.body.getComments();
        wordComments.load("items/content");
        await context.sync();

        let targetWordComment = null;
        for (let i = 0; i < wordComments.items.length; i++) {
            const wc = wordComments.items[i];
            const content = wc.content;
            const cid = content.includes("|||") ? content.split("|||")[0] : content;
            if (cid === commentId) {
                targetWordComment = wc;
                break;
            }
        }

        if (targetWordComment) {
            const newContent = commentId + "|||" + JSON.stringify({ items: commentData.items });
            targetWordComment.content = newContent;
            await context.sync();
            setEditingCommentIds(prev => {
                const next = new Set(prev);
                next.delete(commentId);
                return next;
            });
        } else {
            alert("Could not find this comment in the Word document. It may have been deleted.");
        }
      });
    } catch (error) {
      console.error("Error saving comment:", error);
      alert("Failed to save comment.");
    } finally {
      setSavingCommentId(null);
    }
  }, [comments, officeReady]);

  async function loadCommentsFromWord() {
    setLoading(true);
    setLoadingProgress(0);
    setEditingCommentIds(new Set());
    try {
      await Word.run(async (context) => {
        const wordComments = context.document.body.getComments();
        wordComments.load("items");
        await context.sync();

        const items = wordComments.items;
        const total = items.length;
        const commentData = [];
        
        const CHUNK_SIZE = 50; 
        for (let i = 0; i < total; i += CHUNK_SIZE) {
            const chunk = items.slice(i, i + CHUNK_SIZE);
            const ranges = chunk.map(c => {
                c.load("content");
                const r = c.getRange();
                r.load("start");
                return r;
            });
            await context.sync();

            chunk.forEach((comment, index) => {
                const range = ranges[index];
                const content = comment.content;
                let commentId;
                let tableData;

                if (content.includes("|||")) {
                    const parts = content.split("|||");
                    commentId = parts[0];
                    try {
                        tableData = JSON.parse(parts[1]);
                    } catch (e) {
                        tableData = { items: [createEmptyItem()] };
                    }
                } else {
                    commentId = content;
                    tableData = { items: [createEmptyItem()] };
                }

                commentData.push({
                    id: commentId,
                    position: range.start,
                    location: "Position " + range.start,
                    items: tableData.items
                });
            });
            setLoadingProgress(Math.round(((i + chunk.length) / total) * 100));
        }

        commentData.sort((a, b) => a.position - b.position);
        setComments(commentData);

        if (commentData.length > 0) {
          setHistory([JSON.parse(JSON.stringify(commentData))]);
          setHistoryIndex(0);
          setExpandedComments(new Set([commentData[0].id]));
        }
      });
    } catch (error) {
      console.error("Error loading comments:", error);
      alert("Error loading comments: " + error.message);
    } finally {
      setLoading(false);
      setLoadingProgress(0);
    }
  }

  async function createNewCommentFromSelection() {
    if (!officeReady) {
      alert("Please wait for Office to finish loading");
      return;
    }
    try {
      await Word.run(async (context) => {
        const range = context.document.getSelection();
        range.load("text");
        await context.sync();
        if (range.text.length === 0) {
          alert("Please select some text first!");
          return;
        }
        let locationText = range.text.substring(0, LOCATION_PREVIEW_LENGTH);
        if (range.text.length > LOCATION_PREVIEW_LENGTH) {
          locationText += "...";
        }
        setNewCommentLocation('Text: "' + locationText + '"');
        setShowCreateDialog(true);
      });
    } catch (error) {
      console.error("Error creating comment:", error);
      alert("Error creating comment: " + error.message);
    }
  }

  async function finalizeCreateComment() {
    if (!newCommentId.trim()) {
      alert("Please enter a comment ID!");
      return;
    }
    if (comments.some((c) => c.id === newCommentId)) {
      alert("A comment with this ID already exists!");
      return;
    }
    try {
      await Word.run(async (context) => {
        const range = context.document.getSelection();
        range.insertComment(newCommentId);
        await context.sync();
        const timestamp = new Date();
        const newComment = {
          id: newCommentId,
          location: newCommentLocation,
          items: [createEmptyItem()]
        };
        const updatedComments = [...comments, newComment];
        setComments(updatedComments);
        saveToHistory(updatedComments);
        setExpandedComments((prev) => new Set([...prev, newCommentId]));
        setEditingCommentIds(prev => new Set(prev).add(newCommentId));
        setShowCreateDialog(false);
        setNewCommentId("");
        setNewCommentLocation("");
        alert("Comment created successfully!");
      });
    } catch (error) {
      console.error("Error finalizing comment:", error);
      alert("Error creating comment: " + error.message);
    }
  }

  async function jumpToComment(commentId) {
    try {
      await Word.run(async (context) => {
        const wordComments = context.document.body.getComments();
        wordComments.load("items");
        await context.sync();
        let found = false;
        for (let i = 0; i < wordComments.items.length; i++) {
          const comment = wordComments.items[i];
          comment.load("content");
          await context.sync();
          const content = comment.content;
          const actualCommentId = content.includes("|||") ? content.split("|||")[0] : content;
          if (actualCommentId === commentId) {
            const range = comment.getRange();
            range.select();
            found = true;
            break;
          }
        }
        if (!found) {
          alert("Could not find this comment in the document.");
        }
      });
    } catch (error) {
      console.error("Error jumping to comment:", error);
      alert("Error navigating to comment: " + error.message);
    }
  }

  const filteredComments = useMemo(() => {
    if (!debouncedSearchQuery.trim()) return comments;
    const query = debouncedSearchQuery.toLowerCase();
    return comments.filter((comment) => {
      if (comment.id.toLowerCase().includes(query)) return true;
      if (comment.location.toLowerCase().includes(query)) return true;
      return comment.items.some((item) => {
        const stripHtml = (html) => {
          const temp = document.createElement("div");
          temp.innerHTML = html || "";
          return temp.textContent || temp.innerText || "";
        };
        return (
          (item.id && item.id.toLowerCase().includes(query)) ||
          stripHtml(item.admin).toLowerCase().includes(query) ||
          stripHtml(item.proof).toLowerCase().includes(query) ||
          stripHtml(item.galley).toLowerCase().includes(query)
        );
      });
    });
  }, [comments, debouncedSearchQuery]);

  const toggleExpand = useCallback((commentId) => {
    setExpandedComments((prev) => {
      const newExpanded = new Set(prev);
      if (newExpanded.has(commentId)) {
        newExpanded.delete(commentId);
      } else {
        newExpanded.add(commentId);
      }
      return newExpanded;
    });
  }, []);

  const expandAll = useCallback(() => {
    setExpandedComments(new Set(comments.map((c) => c.id)));
  }, [comments]);

  const collapseAll = useCallback(() => {
    setExpandedComments(new Set());
  }, []);

  const toggleColumn = useCallback((columnName) => {
    setCollapsedColumns((prev) => {
      const newCollapsed = new Set(prev);
      if (newCollapsed.has(columnName)) {
        newCollapsed.delete(columnName);
      } else {
        newCollapsed.add(columnName);
      }
      return newCollapsed;
    });
  }, []);

  const addRowAfter = useCallback((commentId, afterIndex) => {
    setComments((prevComments) => {
      const newComments = prevComments.map((comment) => {
        if (comment.id === commentId) {
          const newItems = [...comment.items];
          newItems.splice(afterIndex + 1, 0, createEmptyItem());
          return { ...comment, items: newItems };
        }
        return comment;
      });
      saveToHistory(newComments);
      return newComments;
    });
  }, [saveToHistory]);

  const toggleHeading = useCallback((commentId, itemIndex) => {
    setComments((prevComments) => {
      const newComments = prevComments.map((comment) => {
        if (comment.id === commentId) {
          const newItems = [...comment.items];
          newItems[itemIndex] = {...newItems[itemIndex], isHeading: !newItems[itemIndex].isHeading};
          return { ...comment, items: newItems };
        }
        return comment;
      });
      saveToHistory(newComments);
      return newComments;
    });
  }, [saveToHistory]);

  const updateCell = useCallback((commentId, itemIndex, column, value) => {
    if (!currentUsername && column !== "id" && column !== "isHeading" && !column.startsWith("_") && value && value.trim()) {
      pendingEditRef.current = { commentId: commentId, itemIndex: itemIndex, column: column, value: value };
      setShowUsernameDialog(true);
      return;
    }
    setComments((prevComments) => prevComments.map((comment) => {
      if (comment.id === commentId) {
        const newItems = [...comment.items];
        const updatedItem = {...newItems[itemIndex], [column]: value};
        if (currentUsername && column !== "id" && column !== "isHeading" && !column.startsWith("_")) {
          const editorKey = "_" + column + "Editor";
          updatedItem[editorKey] = currentUsername;
        }
        newItems[itemIndex] = updatedItem;
        return {...comment, items: newItems};
      }
      return comment;
    }));
  }, [currentUsername]);

  const confirmUsername = useCallback(() => {
    if (tempUsername.trim()) {
      const username = tempUsername.trim();
      setCurrentUsername(username);
      setShowUsernameDialog(false);
      if (pendingEditRef.current) {
        const pending = pendingEditRef.current;
        setComments((prevComments) => prevComments.map((comment) => {
          if (comment.id === pending.commentId) {
            const newItems = [...comment.items];
            const updatedItem = { ...newItems[pending.itemIndex], [pending.column]: pending.value };
            const editorKey = "_" + pending.column + "Editor";
            updatedItem[editorKey] = username;
            newItems[pending.itemIndex] = updatedItem;
            return { ...comment, items: newItems };
          }
          return comment;
        }));
        pendingEditRef.current = null;
      }
      setTempUsername("");
    }
  }, [tempUsername]);

  const deleteRow = useCallback((commentId, itemIndex) => {
    setComments((prevComments) => {
      const newComments = prevComments.map((comment) => {
        if (comment.id === commentId) {
          if (comment.items.length <= 1) {
            alert("Cannot delete the last row. Delete the comment from Word instead.");
            return comment;
          }
          const newItems = comment.items.filter((_, idx) => idx !== itemIndex);
          return { ...comment, items: newItems };
        }
        return comment;
      });
      saveToHistory(newComments);
      return newComments;
    });
    setDeleteConfirm(null);
  }, [saveToHistory]);

  const handleDialogKeyDown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      finalizeCreateComment();
    } else if (e.key === "Escape") {
      setShowCreateDialog(false);
      setNewCommentId("");
      setNewCommentLocation("");
    }
  };

  useEffect(() => {
    if (showCreateDialog && commentIdInputRef.current) {
      commentIdInputRef.current.focus();
    }
  }, [showCreateDialog]);

  const exportComments = useCallback(() => {
    const dataStr = JSON.stringify(comments, null, 2);
    const dataBlob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(dataBlob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "law-review-comments-" + new Date().toISOString().split("T")[0] + ".json";
    link.click();
    URL.revokeObjectURL(url);
  }, [comments]);

  const columns = [
    { key: "admin", label: "Admin" },
    { key: "proof", label: "Proof" },
    { key: "galley", label: "Galley" }
  ];

  return (
    <div className="h-screen flex flex-col bg-gray-50">
      <div className="bg-[#0C2340] border-b border-[#1E3A5F] px-3 py-1.5">
        <div className="flex items-center justify-between gap-2 mb-1.5">

              <ClipboardIcon />
            </button>
            <button onClick={undo} disabled={historyIndex <= 0} className={(historyIndex <= 0 ? "bg-[#4A5568] cursor-not-allowed" : "bg-[#1E3A5F] hover:bg-[#2D4A6F] cursor-pointer") + " text-white px-2 py-0.5 rounded text-xs font-medium transition-colors"} title="Undo (Ctrl+Z)">⎌</button>
            <button onClick={redo} disabled={historyIndex >= history.length - 1} className={(historyIndex >= history.length - 1 ? "bg-[#4A5568] cursor-not-allowed" : "bg-[#1E3A5F] hover:bg-[#2D4A6F] cursor-pointer") + " text-white px-2 py-0.5 rounded text-xs font-medium transition-colors"} title="Redo (Ctrl+Shift+Z)">↷</button>
            <button onClick={exportComments} className="bg-[#1E3A5F] hover:bg-[#2D4A6F] text-white px-2 py-0.5 rounded text-xs font-medium transition-colors cursor-pointer" title="Export to JSON">↓</button>
          </div>

          <button onClick={() => applyFormat("italic")} className="px-2 py-0.5 bg-[#334155] hover:bg-[#1E293B] border border-[#475569] rounded italic text-white text-xs transition-colors" title="Italic (Ctrl+I)">I</button>
          <button onClick={toggleHighlight} className="px-2 py-0.5 bg-[#C99700] hover:bg-[#B8860B] border border-[#B8860B] rounded text-white text-xs font-medium transition-colors" title="Toggle Highlight">H</button>
          <button onClick={toggleRed} className="px-2 py-0.5 bg-red-500 hover:bg-red-600 border border-red-600 rounded text-white text-xs font-medium transition-colors" title="Toggle Red Text">R</button>
          <button onClick={() => applyFormat("removeFormat")} className="px-2 py-0.5 bg-[#334155] hover:bg-[#1E293B] border border-[#475569] rounded text-red-400 text-xs transition-colors" title="Clear Formatting">✕</button>
          <div className="border-l border-gray-500 mx-1"></div>
          <button onClick={expandAll} className="px-2 py-0.5 bg-[#334155] hover:bg-[#1E293B] border border-[#475569] rounded text-white text-xs transition-colors" title="Expand All">⊞</button>
          <button onClick={collapseAll} className="px-2 py-0.5 bg-[#334155] hover:bg-[#1E293B] border border-[#475569] rounded text-white text-xs transition-colors" title="Collapse All">⊟</button>
        </div>

        <div className="mt-1.5 flex gap-2 items-center">
          <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search comments..." className="flex-1 px-2 py-1 text-xs border border-gray-500 rounded bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gray-400" />
          {searchQuery && (<button onClick={() => setSearchQuery("")} className="text-gray-400 hover:text-white text-xs">✕</button>)}
          {currentUsername && (<div className="text-xs text-gray-300 flex items-center gap-1"><span>👤 {currentUsername}</span><button onClick={() => setCurrentUsername(null)} className="text-gray-400 hover:text-white" title="Change user">✎</button></div>)}
        </div>

      {showUsernameDialog && (
        <div className="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 fade-in">

            <div className="mb-4">
              <label className="block text-sm font-medium text-gray-700 mb-1">Your name will appear on cells you edit</label>
              <input type="text" value={tempUsername} onChange={(e) => setTempUsername(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); confirmUsername(); } else if (e.key === "Escape") { setShowUsernameDialog(false); pendingEditRef.current = null; setTempUsername(""); }}} className="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent" placeholder="Your name" autoFocus />
            </div>
            <div className="flex gap-2 justify-end">

              <button onClick={confirmUsername} className="px-4 py-2 bg-[#C99700] text-white rounded hover:bg-[#B8860B] text-sm font-medium transition-colors">Confirm</button>
            </div>
          </div>
        </div>

      {showCreateDialog && (
        <div className="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 fade-in">

            <div className="mb-4">
              <label className="block text-sm font-medium text-gray-700 mb-1">Comment ID (e.g., "125A")</label>

            </div>
            <div className="mb-4">
              <label className="block text-sm font-medium text-gray-700 mb-1">Location</label>
              <input type="text" value={newCommentLocation} onChange={(e) => setNewCommentLocation(e.target.value)} onKeyDown={handleDialogKeyDown} className="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent" />
              <p className="mt-2 text-xs text-gray-500 bg-gray-50 p-2 rounded">💡 A Word comment will appear in the margin. To delete later, just delete the Word comment and click Refresh.</p>

            <div className="flex gap-2 justify-end">
              <button onClick={() => { setShowCreateDialog(false); setNewCommentId(""); setNewCommentLocation(""); }} className="px-4 py-2 border border-gray-300 rounded hover:bg-gray-50 text-sm transition-colors">Cancel</button>
              <button onClick={finalizeCreateComment} className="px-4 py-2 bg-[#C99700] text-white rounded hover:bg-[#B8860B] text-sm font-medium transition-colors">Create Comment</button>

        <div className="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 fade-in">
          <div className="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl border border-gray-200">
            <h2 className="text-lg font-semibold mb-4 text-gray-800">Delete Row?</h2>
            <p className="text-sm text-gray-600 mb-4">Are you sure you want to delete this row? This action can be undone.</p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setDeleteConfirm(null)} className="px-4 py-2 border border-gray-300 rounded hover:bg-gray-50 text-sm transition-colors">Cancel</button>
              <button onClick={() => deleteRow(deleteConfirm.commentId, deleteConfirm.itemIndex)} className="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 text-sm font-medium transition-colors">Delete</button>
            </div>
          </div>
        </div>
      )}

      <div className="flex-1 overflow-y-auto p-2">
        {loading ? (
          <div className="flex flex-col items-center justify-center mt-20 p-4">
            <div className="w-64 bg-gray-200 rounded-full h-2.5 dark:bg-gray-700 mb-4">
              <div className="bg-[#C99700] h-2.5 rounded-full transition-all duration-300" style={{ width: `${loadingProgress}%` }}></div>
            </div>
            <p className="text-sm text-gray-600 font-medium">Loading comments... {loadingProgress}%</p>
            <p className="text-xs text-gray-400 mt-1">Parsing document structure</p>
          </div>
        ) : comments.length === 0 ? (
          <div className="text-center text-gray-500 mt-8 bg-white p-6 rounded border border-gray-200 max-w-sm mx-auto">
            <p className="text-base mb-2">📋 No comments yet</p>
            <p className="text-xs mb-1">Select some text and click "New Comment" to get started.</p>
            <p className="text-xs mt-3 text-gray-400">💡 Tip: Delete comments by right-clicking the Word comment in the margin, then click Refresh here.</p>
          </div>
        ) : filteredComments.length === 0 ? (
          <div className="text-center text-gray-500 mt-8">
            <p>No comments match "{debouncedSearchQuery}"</p>
            <button onClick={() => setSearchQuery("")} className="mt-2 text-sky-500 hover:text-sky-600 text-sm">Clear search</button>
          </div>
        ) : (
          filteredComments.map((comment) => (
            <div key={comment.id} id={"comment-" + comment.id} className={"mb-2 bg-white rounded border border-gray-200 shadow-sm" + (expandedComments.has(comment.id) ? " border-l-4 border-[#C99700]" : "")}>
              <div className="px-1.5 py-0.5 bg-gray-50 border-b border-gray-200 flex items-center justify-between gap-1.5">
                <div className="flex items-center gap-1.5 flex-1 cursor-pointer hover:bg-gray-100 px-1 py-0.5 rounded transition-colors" onClick={() => toggleExpand(comment.id)}>
                  {expandedComments.has(comment.id) ? <ChevronUp /> : <ChevronDown />}
                  <div className="text-xs">
                    <span className="font-semibold text-gray-700 cursor-pointer hover:underline hover:text-[#C99700]" onClick={(e) => { e.stopPropagation(); jumpToComment(comment.id); }}>{comment.id}</span>
                    <span className="mx-1 text-gray-400">({comment.items.length})</span>
                    <span className="mx-1 text-gray-400">•</span>
                    <span className="text-gray-600">{comment.location}</span>
                  </div>
                </div>
                {/* Header Edit/Save Controls */}
                <div className="flex gap-1" onClick={(e) => e.stopPropagation()}>
                  {editingCommentIds.has(comment.id) ? (
                    <button 
                      onClick={() => handleSaveComment(comment.id)} 
                      disabled={savingCommentId === comment.id}
                      className="flex items-center gap-1 px-2 py-0.5 bg-green-600 hover:bg-green-700 text-white rounded text-xs font-medium transition-colors"
                    >
                      {savingCommentId === comment.id ? "Saving..." : <><SaveIcon /> Save</>}
                    </button>
                  ) : (
                    <button 
                      onClick={() => handleEditComment(comment.id)} 
                      className="flex items-center gap-1 px-2 py-0.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded text-xs font-medium transition-colors"
                    >
                      <EditIcon /> Edit
                    </button>
                  )}
                </div>
              </div>

              {expandedComments.has(comment.id) && (
                <div className="overflow-x-auto">
                  <table className="w-full border-collapse text-xs">
                    <thead className="bg-gray-100 border-b border-gray-300">
                      <tr>
                        <th className="px-1.5 py-0.5 text-left font-semibold text-gray-700 border-r border-gray-200" style={{ minWidth: "40px", width: "40px" }}>#</th>
                        {columns.map((col) => (
                          !collapsedColumns.has(col.key) ? (
                            <th key={col.key} className="px-1.5 py-0.5 text-left font-semibold text-gray-700 border-r border-gray-200 cursor-pointer hover:bg-gray-200 transition-colors" style={{ minWidth: "250px" }} onClick={(e) => { e.stopPropagation(); toggleColumn(col.key); }}>
                              <div className="flex items-center justify-between">
                                <div>
                                  <div>{col.label}</div>
                                  {(() => {
                                    const editorKey = "_" + col.key + "Editor";
                                    const editors = comment.items.map((item) => item[editorKey]).filter(Boolean);
                                    const lastEditor = editors[editors.length - 1];
                                    return lastEditor ? (<div className="text-xs font-normal text-gray-500 italic">{lastEditor}</div>) : null;
                                  })()}
                                </div>
                                <ChevronUp />
                              </div>
                            </th>
                          ) : null
                        ))}
                        {collapsedColumns.size > 0 && (
                          <th className="px-1 py-1 text-center font-semibold text-gray-500 border-r border-gray-200">
                            <div className="flex flex-col gap-0.5">
                              {Array.from(collapsedColumns).map((col) => (
                                <button key={col} onClick={(e) => { e.stopPropagation(); toggleColumn(col); }} className="px-1.5 py-0.5 bg-gray-200 hover:bg-gray-300 rounded text-xs flex items-center gap-1 transition-colors">
                                  <ChevronDown /> {col.charAt(0).toUpperCase() + col.slice(1)}
                                </button>
                              ))}
                            </div>
                          </th>
                        )}
                        <th className="px-1 py-1 w-8"></th>
                      </tr>
                    </thead>
                    <tbody>
                      {comment.items.map((item, idx) => (
                        <CommentRow 
                          key={idx} 
                          item={item} 
                          idx={idx} 
                          commentId={comment.id} 
                          columns={columns}
                          collapsedColumns={collapsedColumns}
                          updateCell={updateCell}
                          toggleCellImplemented={toggleCellImplemented}
                          insertTextToWord={insertTextToWord}
                          addRowAfter={addRowAfter}
                          toggleHeading={toggleHeading}
                          setDeleteConfirm={setDeleteConfirm}
                          isEditing={editingCommentIds.has(comment.id)}
                        />
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          ))
        )}
      </div>

      <div className="bg-[#F8FAFC] border-t border-[#E2E8F0] px-3 py-1 text-xs text-gray-500 flex justify-between">
        <span>{comments.length} comment{comments.length !== 1 ? "s" : ""} • {comments.reduce((acc, c) => acc + c.items.length, 0)} total items</span>
        <span>v59</span>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <ErrorBoundary>
    <CommentViewer />
  </ErrorBoundary>
);
</script>
</body>
</html>
